name: CI/CD Pipeline

on:
  push:
    branches: 
      - master
      - test
  pull_request:
    branches:
      - master
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: users-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: users-test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      HASH_SALT_ROUNDS: ${{ secrets.HASH_SALT_ROUNDS }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Verificar variables de entorno
      run: |
        echo "NODE_ENV=$NODE_ENV"
        echo "DB_HOST=$DB_HOST"
        echo "DB_PORT=$DB_PORT"
        echo "DB_USERNAME=$DB_USERNAME"
        echo "DB_DATABASE=$DB_DATABASE"
        echo "REDIS_HOST=$REDIS_HOST"
        echo "REDIS_PORT=$REDIS_PORT"
        echo "HASH_SALT_ROUNDS=$HASH_SALT_ROUNDS"
        echo "JWT_SECRET configurado: $([ -n "$JWT_SECRET" ] && echo sí || echo no)"
        echo "REFRESH_TOKEN_SECRET configurado: $([ -n "$REFRESH_TOKEN_SECRET" ] && echo sí || echo no)"

    - name: Install dependencies
      run: npm install
    
    - name: Build Application
      run: npm run build

    - name: Run Unit tests
      run: npm run test -- --runInBand

    - name: Ejecutar pruebas E2E
      run: npm run test:e2e