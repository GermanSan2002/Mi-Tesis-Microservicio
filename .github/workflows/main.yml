name: CI/CD Pipeline

on:
  push:
    branches: 
      - master
      - test
  pull_request:
    branches:
      - master
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run Unit tests
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: npm run test -- --runInBand
    
    - name: Build Application
      run: npm run build